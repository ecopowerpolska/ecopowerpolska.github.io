# build-i-wdrozenie.yml — Astro → GitHub Pages
#
# 🔴 WERSJE AKCJI TO LICZNIKI STANU, NIE STAŁE. Trzy poniżej odczytane u źródła
#    (docs.astro.build/en/guides/deploy/github/) dnia 2026-09-04; `actions/setup-node@v7`
#    z dokumentu Potwora o CMS-ie, ta sama data. Zapis starszy niż 30 dni weryfikuj
#    u źródła; nie podnoś wersji „na wyczucie".
#
# ✅ URUCHOMIONY. Pierwszy przebieg odbył się 2026-09-04; trzy przebiegi zakończone
#    sukcesem, Pages w stanie „built", pełny cykl build+deploy ok. 33 sekundy.
#    Stan i to, co po tym przebiegu zostało otwarte, mówi docs/PIERWSZY-PRZEBIEG.md.
#
# 🔴 ŻADNEGO SEKRETU W GitHub Secrets tego repozytorium. Pages autoryzuje się tokenem
#    wydawanym na czas przebiegu przez blok `permissions:` niżej. To jedyna przewaga
#    tej drogi nad wgraniem na lh.pl, gdzie trzeba by tam położyć klucz SSH.

name: build-i-wdrozenie

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Codzienna przebudowa publikuje wpisy, których data już minęła (filtr opublikowane() liczy „teraz” w chwili budowania).
  # 07:00 UTC = 08:00 czasu polskiego zimą, 09:00 latem. Job deploy nie zależy od zdarzenia push.
  schedule:
    - cron: '0 7 * * *'
  # Panel treści (Sveltia) commituje do `main`, więc zapis wpisu wyzwala `push`
  # i przebudowuje stronę sam. Osobnego wyzwalacza nie potrzeba.

permissions:
  contents: read
  pages: write
  id-token: write

# Dwa wgrania nie mogą biec naraz; trwającego nie przerywamy w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Node w wersji z .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Walidator ma zero zależności, więc biegnie PRZED instalacją.
      # Czerwony guard zatrzymuje wdrożenie — to jest bramka, nie usterka.
      - name: astro-guard — walidator kodu źródłowego
        run: npm run guard

      # Instaluje zależności (npm ci), buduje i pakuje artefakt dla Pages.
      #
      # PUBLIC_PSI_KLUCZ to JAWNA zmienna Actions (Settings → Variables), NIE sekret:
      # klucz PageSpeed Insights jest przeglądarkowy, ograniczony w Google Cloud do
      # referera https://www.ecopowerpolska.pl/* i https://ecopowerpolska.pl/* oraz do
      # samego PageSpeed Insights API, i trafia do HTML strony /jak-sprawdzic-szybkosc-strony/.
      # Nagłówek „żadnego sekretu w GitHub Secrets" zostaje prawdziwy. Szczegóły: docs/PSI-MODUL.md.
      # `env:` kroku widzą wewnętrzne kroki akcji złożonej (composite), w tym `npm run build`,
      # a Astro czyta PUBLIC_* ze środowiska procesu (withastro/action ma tylko inputy
      # path/node-version/package-manager/build-cmd/cache/cache-dir/out-dir — odczyt action.yml 2026-10-29).
      # Zmienna pusta albo nieustawiona = strona bez modułu na miejscu (formularz GET do pagespeed.web.dev).
      - name: Instalacja, build i spakowanie artefaktu
        uses: withastro/action@v6
        env:
          PUBLIC_PSI_KLUCZ: ${{ vars.PUBLIC_PSI_KLUCZ }}

      # Audyt tego, co naprawdę poleciało: waga JS/CSS per strona + podstawy SEO.
      # Też zero zależności; czyta dist/ zostawiony przez krok wyżej.
      - name: astro-guard — audyt dist
        run: npm run guard:build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
