# config.yml — panel treści Sveltia CMS dla ecopowerpolska.pl
#
# 🔴 TEN PLIK JEST LUSTREM src/content.config.ts. Nazwy pól identyczne, typy zgodne.
#    Rozjazd nie wychodzi w panelu — wychodzi czerwonym buildem w Actions, już PO
#    zapisaniu wpisu przez klienta (potwor-cms-strony §D2).
#
# ⚠️ STAN 2026-09-07: PANEL ZAPISUJE NAPRAWDĘ. Pierwsze zapisy Piotra przeszły tego
#    dnia (ostatni z panelu: commit 8221eb5, committer `GitHub`, podpis PGP). Ten sam
#    dzień przyniósł trzy awarie klasy zapis ginie w ciszy — objawy, przyczyny
#    i domknięcia opisuje docs/CMS-ZASADY-PRACY.md. Trzy rzeczy z tamtego dokumentu
#    rządzą tym plikiem:
#      ① nie wypycha się nic z terminala, gdy Piotr pracuje w panelu (Sveltia commituje
#        z `expectedHeadOid` zapamiętanym przy wczytaniu i nie ponawia);
#      ② po KAŻDEJ zmianie tego pliku trzeba przeładować twardo samo /admin/
#        (GitHub Pages podaje config.yml z max-age=600 — panel pracuje wtedy na starej
#        konfiguracji i zapisuje w starym układzie);
#      ③ walidacja treści należy do TEGO pliku, nie do schematu Zod. Schemat kolekcji
#        nie ma już nic, co mogłoby zatrzymać build — długości i postać adresu pilnuje
#        formularz, gdzie błąd widzi człowiek i może go poprawić.
#
# 🔴 Wzorce `pattern` obejmują znak nowej linii: `[\s\S]`, nigdy `.`. Inaczej tekst
#    wklejony z łamaniem wiersza nie przechodzi walidacji, a panel odmawia zapisu bez
#    czytelnego powodu (zdarzyło się 2026-09-07).
#
# 🔴 Nowych wzorców nie dokłada się na zapas. W pliku zostają wyłącznie te, które
#    były tu przed 2026-09-07 (adres kafelka, długość podpisu, długość zdania pod
#    kafelkami) oraz dwa wymagane przez kontrakt danych (klucz grupy, długość opisu
#    grupy). Pola tekstowe stron mają limity wyłącznie w podpowiedziach — jako zalecenie
#    dla wyszukiwarek, nie jako blokada zapisu.
#
# 🔴 `repo` niżej zakłada repozytorium `ecopowerpolska/ecopowerpolska.github.io`
#    (witryna użytkownika, bez `base`). Jeśli Piotr wybierze inną nazwę repozytorium,
#    trzeba poprawić TĘ linię i `site`/`base` w astro.config.mjs.

backend:
  name: github
  repo: ecopowerpolska/ecopowerpolska.github.io
  branch: main
  # LOGOWANIE — pełna instrukcja krok po kroku dla Piotra: docs/CMS-LOGOWANIE.md.
  # Skrót ustaleń (sprawdzone w KODZIE Sveltii, wersja 0.206.1 — ta przypięta
  # w public/admin/index.html):
  #
  # 🔴 `auth_methods: [token]` — zostaje TYLKO przycisk logowania tokenem dostępu.
  # Bez tej linii panel pokazuje TAKŻE przycisk logowania przez GitHub (OAuth),
  # a ten przycisk i tak nie działa: wymaga Workera `sveltia-cms-auth`, który nie jest
  # wdrożony (zob. `base_url` niżej). Klikalny, ale zepsuty przycisk jest gorszy niż
  # jego brak. Źródło: src/lib/components/entrance/sign-in.svelte (Sveltia chowa
  # przycisk OAuth, gdy `auth_methods` go nie wymienia) i
  # src/lib/services/config/parser/backend.js (nazwa i składnia klucza).
  #
  # 🔴 TO ZOSTAJE ŚWIADOMIE, a nie z lenistwa. Token wkleja się RAZ na przeglądarkę
  # (trafia do localStorage) i od tej chwili panel otwiera się od razu. OAuth
  # kosztowałby Piotra konto Cloudflare, wdrożenie Workera, rejestrację aplikacji
  # OAuth na GitHubie i trzy zmienne środowiskowe — czyli dokładnie te kolejne progi
  # wejścia do ustawień, których ma nie być. Droga jest JEDNA i cała mieści się
  # w oknie logowania panelu.
  auth_methods: [token]
  #
  # base_url: https://sveltia-cms-auth.<TWOJA-SUBDOMENA>.workers.dev
  # ↑ ZAKOMENTOWANE CELOWO. Odkomentuj DOPIERO gdy Worker `sveltia-cms-auth` będzie
  # wdrożony na Cloudflare (docs/CMS-LOGOWANIE.md, sekcja o logowaniu bez tokenu) —
  # podmień <TWOJA-SUBDOMENA> na rzeczywisty adres z panelu Cloudflare Workers. Gdy ta
  # linia wraca, zmień też linię wyżej na `auth_methods: [token, oauth]` (albo usuń ją
  # całkiem), żeby przycisk OAuth znów się pokazał.
  #
  # Token GitHuba do logowania za pomocą tokenu: FINE-GRAINED (nowy typ), nie
  # klasyczny. Sveltia sama generuje link do
  # github.com/settings/personal-access-tokens/new z uprawnieniem Contents: write
  # wstawionym z góry (src/lib/services/backends/git/github/auth.js, funkcja
  # getTokenPageURL — sprawdzone 2026-09-06). Repozytorium/właściciela trzeba wybrać
  # na tamtej stronie ręcznie — Sveltia tego nie robi za Piotra.
  # 🔴 Token jest SEKRETEM: nie trafia do repo, do tego pliku ani do rozmowy
  # (kontrakt warsztatu §4.4).

# Ścieżki mediów: obrazki kafelków MUSZĄ trafiać do src/assets/, nie do public/ —
# tylko wtedy <Image> Astro je optymalizuje (obraz w public/ traci optymalizację).
media_folder: "src/assets/serwisy"
public_folder: "src/assets/serwisy"

publish_mode: simple

# ── MENU PANELU ───────────────────────────────────────────────────────────────
# Sześć pozycji, w tej kolejności: Grupy → Realizacje (kafelki) → Wpisy na blogu →
# Pytania i odpowiedzi → Teksty strony (w tym Oferta) → Dane firmy. Kolejność w tym
# pliku = kolejność w menu panelu.
collections:
  # ── ① GRUPY ─────────────────────────────────────────────────────────────────
  # Sekcje, na które dzielą się kafelki. Kafelek wskazuje grupę polem `grupa`
  # niosącym `klucz` stąd (kolekcja `serwisy` niżej, pole `grupa`, widget relation).
  - name: grupy
    label: "Grupy"
    files:
      - name: lista
        label: "Grupy serwisów"
        file: "src/data/grupy.json"
        description: >-
          Kolejność na tej liście = kolejność sekcji na stronie. Chwyć grupę za uchwyt
          po lewej i przeciągnij; na telefonie użyj guzików w górę/w dół. Grupa, do
          której nie jest przypisany ani jeden widoczny kafelek, NIE pokazuje się na
          stronie wcale — ani nagłówek sekcji, ani odnośnik w spisie. Dopóki grup jest
          mniej niż dwie, strona pokazuje jedną wspólną siatkę kafelków, bez nagłówków
          sekcji.
        fields:
          - name: grupy
            label: "Grupy"
            label_singular: "Grupa"
            widget: list
            required: false
            allow_add: true
            collapsed: true
            summary: "{{fields.nazwa}}"
            fields:
              - name: klucz
                label: "Klucz grupy"
                widget: string
                required: true
                pattern:
                  - "^[a-z0-9-]+$"
                  - "Tylko małe litery bez polskich znaków, cyfry i myślnik, np. wykonczenia"
                hint: >-
                  Identyfikator techniczny, po którym kafelek wskazuje tę grupę. Małe
                  litery bez polskich znaków, np. wykonczenia. Musi być inny niż klucze
                  pozostałych grup. Po zapisaniu NIE zmieniaj — kafelki wskazują grupę
                  właśnie tym napisem i po zmianie klucza wypadną z sekcji.

              - name: nazwa
                label: "Nazwa sekcji na stronie"
                widget: string
                required: true
                hint: >-
                  Napis nagłówka sekcji, np. Wykończenia wnętrz. To jedyne z tych pól,
                  które odwiedzający widzi.

              - name: opis
                label: "Zdanie pod nagłówkiem sekcji (opcjonalnie)"
                widget: string
                required: false
                pattern:
                  - "^[\\s\\S]{0,200}$"
                  - "Zdanie może mieć najwyżej 200 znaków"
                hint: >-
                  Do 200 znaków. Puste pole = pod nagłówkiem sekcji nie pojawia się nic,
                  sam nagłówek zostaje.

  # ── ② SERWISY (KAFELKI) ─────────────────────────────────────────────────────
  # 🔴 JEDEN PLIK, NIE JEDEN PLIK NA SERWIS. Powód jest jeden i konkretny: uchwyt
  # do przeciągania ma wyłącznie widget `list`. Sveltia nie umie ręcznie sortować
  # wpisów kolekcji katalogowej, więc przy pliku na serwis kolejność dałoby się
  # ustawiać tylko wpisywaniem liczb. docs/DECYZJE-WIZUALNE.md D8.
  - name: serwisy
    label: "Realizacje (kafelki)"
    files:
      - name: lista
        label: "Kafelki na stronie głównej"
        file: "src/data/serwisy.json"
        description: >-
          Kolejność na tej liście = kolejność kafelków na stronie. Chwyć kafelek
          za uchwyt po lewej i przeciągnij; na telefonie użyj guzików w górę/w dół.
        media_folder: "../assets/serwisy"
        public_folder: "../assets/serwisy"
        fields:
          - name: serwisy
            label: "Kafelki"
            label_singular: "Kafelek"
            widget: list
            allow_add: true
            collapsed: true
            summary: "{{fields.nazwa}} — {{fields.adres}}"
            fields:
              - name: nazwa
                label: "Nazwa serwisu"
                widget: string
                required: true
                hint: "Napis na kafelku, np. nadihome.pl"

              - name: adres
                label: "Adres docelowy"
                widget: string
                required: true
                hint: "Pełny adres z https:// — tam prowadzi kliknięcie kafelka."
                # Wzorzec stał tu przed 2026-09-07 i zostaje: schemat Zod nie sprawdza
                # już postaci adresu (nie wolno mu — błąd schematu zamraża publikację),
                # więc to JEDYNE miejsce, gdzie literówka w adresie zostanie złapana,
                # i to na oczach człowieka.
                pattern:
                  - "^https?://[^\\s]+\\.[^\\s]+$"
                  - "Adres musi zaczynać się od http:// albo https:// i nie może zawierać spacji"

              - name: opis
                label: "Krótki podpis (opcjonalnie)"
                widget: string
                required: false
                pattern:
                  - "^[\\s\\S]{0,160}$"
                  - "Podpis może mieć najwyżej 160 znaków"
                hint: >-
                  Do 160 znaków. Puste pole jest w porządku — kafelek pokaże samą nazwę.

              - name: zakres
                label: "Co zrobiliśmy (opcjonalnie)"
                widget: text
                required: false
                pattern:
                  - "^[\\s\\S]{0,260}$"
                  - "Najwyżej 260 znaków"
                hint: "Jedno zdanie o wykonanej pracy, np. Astro, panel treści, hosting lh.pl, Turnstile, blog. Puste = bez akapitu."

              # 🔴 Zamiast dawnego pola `kategoria` (tekst dowolny, w którym literówka
              # tworzyła nową kategorię) — WYBÓR z listy grup zdefiniowanych w pozycji
              # menu Grupy. Sveltia 0.206.1 obsługuje wskazanie listy wewnątrz pliku
              # kolekcji typu `files` przez gwiazdkę w `value_field` / `display_fields` /
              # `search_fields` (dokumentacja: sveltiacms.app/en/docs/fields/relation,
              # rozdział Referencing a File in a File Collection; w kodzie
              # src/lib/services/contents/fields/relation/helpers/list-fields.js).
              # Zapis bez klamer (`grupy.*.klucz`) też działa — Sveltia sama go opakowuje
              # (helpers/field-names.js, funkcja normalizeFieldName) — ale trzymamy się
              # postaci z dokumentacji.
              # Pole jest opcjonalne, więc panel dokłada na górze listy pozycję pustą;
              # wybranie jej zapisuje pusty tekst, nie usuwa pola.
              - name: grupa
                label: "Grupa (sekcja na stronie)"
                widget: relation
                required: false
                collection: grupy
                file: lista
                value_field: "{{grupy.*.klucz}}"
                display_fields: ["{{grupy.*.nazwa}}"]
                search_fields: ["{{grupy.*.nazwa}}", "{{grupy.*.klucz}}"]
                hint: >-
                  Wybierz z listy sekcję, w której ma stanąć ten kafelek. Lista bierze
                  się z pozycji menu Grupy — jeśli jest pusta, najpierw dodaj tam grupę.
                  Puste pole (pozycja pusta na górze listy) = kafelek trafia na koniec
                  strony, do sekcji Inne. Dopóki realnie użytych grup jest mniej niż
                  dwie, strona i tak pokazuje jedną wspólną siatkę, bez nagłówków sekcji.

              - name: obrazek
                label: "Obrazek kafelka"
                widget: image
                required: false
                hint: "Zrzut strony 1440×900 (16:10), szerokość co najmniej 720 px."

              - name: alt
                label: "Opis obrazka dla czytnika ekranu"
                widget: string
                required: false
                hint: >-
                  Opisz, co widać. Puste pole jest w porządku — zdjęcie jest wtedy
                  ozdobne, a nazwę serwisu i tak widać na kafelku.

              - name: ukryty
                label: "Ukryty (zostaje w panelu, znika ze strony)"
                widget: boolean
                default: false
                required: false

  # ── ②a WPISY NA BLOGU ───────────────────────────────────────────────────────
  # Lustro kolekcji `wpisy` z src/content.config.ts (2026-10-23). JEDEN PLIK NA WPIS
  # (src/content/wpisy/<adres>.md), bo wpisy nie mają ręcznej kolejności — porządek
  # daje data publikacji. Nazwa pliku = adres wpisu /blog/<adres>/ — po publikacji
  # NIE zmieniaj (stary adres da 404).
  # 🔴 Zdjęcie w schemacie jest TEKSTEM, nie image(): plik-widmo daje wpis bez zdjęcia,
  # nie zamrożoną stronę (cms-github-pages §B.2). Data bez strefy = czas polski.
  - name: wpisy
    label: "Wpisy na blogu"
    label_singular: "Wpis"
    folder: "src/content/wpisy"
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: tytul
    summary: "{{tytul}} — {{dataPublikacji}}"
    sortable_fields: ["dataPublikacji", "tytul"]
    media_folder: "../../assets/blog"
    public_folder: "../../assets/blog"
    description: >-
      Każdy wpis to osobna strona pod adresem /blog/… Wpis pojawia się na stronie po
      zapisaniu, gdy jego data publikacji już minęła i nie jest zaznaczony jako szkic.
      Wpis z datą w przyszłości wejdzie przy pierwszej przebudowie strony po tej dacie.
    fields:
      - name: tytul
        label: "Tytuł wpisu (nagłówek na stronie)"
        widget: string
        required: true
        hint: "Najlepiej pytanie albo zdanie, na które wpis odpowiada w pierwszym akapicie."

      - name: tytulSeo
        label: "Tytuł w wyszukiwarce (opcjonalnie)"
        widget: string
        required: false
        hint: "Do 60 znaków. Puste pole = taki sam jak tytuł wpisu."

      - name: opisSeo
        label: "Opis dla wyszukiwarek i zajawka na liście wpisów"
        widget: text
        required: false
        pattern:
          - "^[\\s\\S]{0,200}$"
          - "Opis może mieć najwyżej 200 znaków"
        hint: "Najlepiej 120–160 znaków. Widać go pod tytułem na liście /blog/ i w wyniku Google."

      - name: dataPublikacji
        label: "Data publikacji"
        widget: datetime
        required: true
        format: "YYYY-MM-DDTHH:mm:ssZ"
        hint: "Data widoczna na wpisie. Nie wpisuj daty z przyszłości, chyba że wpis ma wejść później."

      - name: zdjecie
        label: "Zdjęcie główne (opcjonalnie)"
        widget: image
        required: false
        hint: "Prawdziwe zdjęcie, proporcje 3:2, dłuższy bok co najmniej 1440 px."

      - name: zdjecieAlt
        label: "Opis zdjęcia dla czytnika ekranu"
        widget: string
        required: false
        hint: "Opisz, co widać na zdjęciu."

      - name: szkic
        label: "Szkic (zapisany, niewidoczny na stronie)"
        widget: boolean
        default: false
        required: false

      - name: body
        label: "Treść wpisu"
        widget: markdown
        required: true
        hint: "Śródtytuły jako Nagłówek 2. Pierwszy akapit odpowiada wprost na pytanie z tytułu."

  # ── ②b PYTANIA I ODPOWIEDZI (FAQ) ───────────────────────────────────────────
  # Podstrona /faq/ i skrót na stronie głównej (src/components/FaqSkrot.astro), oba
  # z JEDNEGO pliku src/data/faq.json — lista `list`, bo kolejność ustawia się
  # przeciąganiem (jak kafelki, D8). Pliku nie czyta loader kolekcji: importują go
  # src/pages/faq/index.astro i FaqSkrot.astro i każde pole sprowadzają do tekstu,
  # więc null albo brak pola nie zatrzyma builda (cms-github-pages §B.1).
  # Pusty wiersz w odpowiedzi = nowy akapit. Puste pole tekstu strony = napis domyślny.
  - name: faq
    label: "Pytania i odpowiedzi"
    files:
      - name: faq
        label: "Pytania i odpowiedzi (FAQ)"
        file: "src/data/faq.json"
        description: >-
          Podstrona /faq/ i skrót pytań na stronie głównej. Kolejność na liście =
          kolejność na stronie; chwyć pytanie za uchwyt po lewej i przeciągnij. Na stronę
          główną idą pytania z zaznaczonym polem „Pokaż na stronie głównej”, najwyżej
          cztery; gdy żadne nie jest zaznaczone, idą cztery pierwsze.
        fields:
          - name: pytania
            label: "Pytania"
            label_singular: "Pytanie"
            widget: list
            allow_add: true
            collapsed: true
            summary: "{{fields.pytanie}}"
            fields:
              - name: pytanie
                label: "Pytanie"
                widget: string
                required: true
                hint: "Tak, jak zadałby je klient, np. Czy sam zmienię treść na stronie?"

              - name: odpowiedz
                label: "Odpowiedź"
                widget: text
                required: true
                pattern:
                  - "^[\\s\\S]{0,1200}$"
                  - "Odpowiedź może mieć najwyżej 1200 znaków"
                hint: >-
                  Pierwsze zdanie odpowiada wprost na pytanie; najlepiej 2–5 zdań. Pusty
                  wiersz zaczyna nowy akapit. Pytanie bez odpowiedzi nie pokazuje się na stronie.

              - name: kotwica
                label: "Kotwica w adresie (opcjonalnie)"
                widget: string
                required: false
                pattern:
                  - "^[a-z0-9-]*$"
                  - "Tylko małe litery bez polskich znaków, cyfry i myślnik, np. poczta"
                hint: >-
                  Końcówka odnośnika do tego pytania: /faq/#poczta. Puste pole = strona
                  utworzy ją z pytania. Po publikacji NIE zmieniaj — odnośniki z zewnątrz
                  przestaną trafiać w pytanie.

              - name: naGlownej
                label: "Pokaż na stronie głównej"
                widget: boolean
                default: false
                required: false

          - name: naglowek
            label: "Nagłówek podstrony /faq/"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Pytania o strony i sklepy internetowe"

          - name: lead
            label: "Zdanie pod nagłówkiem"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Krótkie odpowiedzi o tym, jak robimy strony i sklepy internetowe."

          - name: tytulKarty
            label: "Tytuł karty i wyniku w wyszukiwarce"
            widget: string
            required: false
            hint: >-
              Najlepiej do 60 znaków. Puste pole = wraca napis domyślny: Pytania o strony
              i sklepy internetowe — EcoPower Polska.

          - name: opisWyszukiwarki
            label: "Opis dla wyszukiwarek"
            widget: text
            required: false
            hint: "Najlepiej do 160 znaków. Puste pole = wraca napis domyślny."

          - name: kontaktNaglowek
            label: "Nagłówek ramki kontaktu pod pytaniami"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Nie ma tu Twojego pytania?"

          - name: kontaktTekst
            label: "Zdanie w ramce kontaktu"
            widget: string
            required: false
            hint: "E-mail i telefon bierze się z Danych firmy. Puste pole = wraca napis domyślny: Napisz albo zadzwoń."

          - name: skrotNaglowek
            label: "Strona główna: nagłówek skrótu pytań"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Najczęstsze pytania"

          - name: skrotLink
            label: "Strona główna: odnośnik do wszystkich pytań"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Wszystkie pytania i odpowiedzi"

          - name: stronaGlowna
            label: "Ścieżka: odnośnik strony głównej"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Strona główna"

          - name: okruszkiEtykieta
            label: "Nazwa ścieżki (dla czytnika ekranu)"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Ścieżka"

          - name: spisEtykieta
            label: "Nazwa spisu pytań (dla czytnika ekranu)"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Spis pytań"

  # ── ③ TEKSTY STRONY ─────────────────────────────────────────────────────────
  # 🔴 KAŻDE pole niżej przechodzi przez funkcję `tekst()` z src/lib/tekst.ts:
  # puste pole NIE kasuje napisu ze strony, tylko przywraca napis domyślny wpisany
  # w kodzie. Podpowiedź każdego pola podaje ten domyślny napis wprost.
  # Wyjątki: Zdanie o spółce na końcu strony i Wstęp pod nagłówkiem realizacji —
  # tam puste pole naprawdę usuwa sekcję albo akapit i tak jest napisane w podpowiedzi.
  - name: teksty
    label: "Teksty strony"
    files:
      # ---- strona główna ----
      - name: strona
        label: "Strona główna"
        file: "src/data/strona.json"
        description: >-
          Napisy strony głównej. Wyczyszczenie pola przywraca napis domyślny — strona
          nie zostanie bez tytułu ani bez nagłówka. Wyjątkiem jest zdanie o spółce na
          końcu strony (puste pole usuwa całą sekcję) i wstęp realizacji (puste = bez akapitu).
        fields:
          - name: tytulKarty
            label: "Tytuł karty przeglądarki i wyniku w wyszukiwarce"
            widget: string
            required: false
            hint: >-
              Napis na karcie przeglądarki i w niebieskiej linii wyniku Google. Najlepiej
              do 60 znaków — dłuższy Google urywa. Puste pole = wraca napis domyślny:
              Strony i sklepy internetowe dla firm — EcoPower Polska.

          - name: opisWyszukiwarki
            label: "Opis dla wyszukiwarek"
            widget: text
            required: false
            hint: >-
              Dwie linijki pod tytułem w wyniku Google, a także podpis strony przy
              udostępnianiu w komunikatorach. Najlepiej do 160 znaków. Puste pole =
              wraca napis domyślny: Budujemy strony internetowe i sklepy internetowe
              dla firm: projekt, panel do edycji treści, hosting, domena i widoczność
              w Google.

          - name: naglowek
            label: "Nagłówek strony (H1)"
            widget: string
            required: false
            hint: >-
              Największy napis na stronie głównej. Puste pole = wraca napis domyślny:
              Budujemy strony i sklepy internetowe dla firm.

          - name: zdanieNaglowka
            label: "Zdanie w nagłówku strony"
            widget: string
            required: false
            hint: >-
              Zdanie pod nagłówkiem strony głównej. Puste pole = wraca napis domyślny:
              Projekt, panel do edycji treści, hosting, domena, poczta i widoczność
              w Google. Potem stronę utrzymujemy.

          - name: hasloAkcji
            label: "Napis odnośnika w nagłówku"
            widget: string
            required: false
            hint: >-
              Odnośnik pod nagłówkiem, prowadzi do sekcji kontaktu. Puste pole = wraca
              napis domyślny: Zapytaj o stronę.

          - name: naglowekRealizacji
            label: "Nagłówek sekcji realizacji"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Realizacje"

          - name: wstepRealizacji
            label: "Wstęp pod nagłówkiem realizacji (opcjonalnie)"
            widget: text
            required: false
            hint: "Jedno zdanie nad kafelkami. Puste pole = bez akapitu, żaden napis domyślny nie wraca."

          - name: zdanieKoncowe
            label: "Zdanie o spółce na końcu strony"
            widget: text
            required: false
            pattern:
              - "^[\\s\\S]{0,400}$"
              - "Najwyżej 400 znaków"
            hint: >-
              Zamknięcie strony głównej, pod kontaktem. 🔴 W tym polu puste
              znaczy pusto: sekcja w ogóle się wtedy nie pokazuje, żaden napis domyślny
              nie wraca.

          - name: napisLicznika
            label: "Napis w pasku licznika"
            widget: string
            required: false
            hint: >-
              Człon po liczbie serwisów, np. 3 serwisy w sieci. Wpisujesz tylko drugą
              część, liczbę strona liczy sama. Puste pole = wraca napis domyślny:
              w sieci.

          - name: nazwaGrupyBezPrzypisania
            label: "Nazwa sekcji dla kafelków bez grupy"
            widget: string
            required: false
            hint: >-
              Nagłówek sekcji na końcu strony, do której trafiają kafelki bez wybranej
              grupy. Widoczna dopiero wtedy, gdy takie kafelki są. Puste pole = wraca
              napis domyślny: Inne.

          - name: komunikatPustejListy
            label: "Komunikat, gdy nie ma żadnego widocznego kafelka"
            widget: string
            required: false
            hint: >-
              Widoczny tylko wtedy, gdy wszystkie kafelki są ukryte albo skasowane.
              Puste pole = wraca napis domyślny: Brak serwisów do pokazania.

          - name: nazwaWitryny
            label: "Nazwa witryny przy udostępnianiu"
            widget: string
            required: false
            hint: >-
              Nazwa nad podglądem strony wklejonej na Facebooka czy do komunikatora
              (og:site_name). Na samej stronie niewidoczna. Puste pole = wraca napis
              domyślny: EcoPower Polska.

          - name: etykietaSekcjiZamykajacej
            label: "Nazwa sekcji zamykającej (dla czytnika ekranu)"
            widget: string
            required: false
            hint: >-
              Opis sekcji ze zdaniem pod kafelkami, czytany przez czytnik ekranu osobie
              niewidomej. Na ekranie niewidoczny. Puste pole = wraca napis domyślny:
              O spółce.

          - name: etykietaSpisuGrup
            label: "Nazwa spisu odnośników do sekcji (dla czytnika ekranu)"
            widget: string
            required: false
            hint: >-
              Opis spisu odnośników prowadzących do sekcji, czytany przez czytnik ekranu.
              Spis pojawia się dopiero przy dwóch grupach. Puste pole = wraca napis
              domyślny: Grupy serwisów.

          - name: ukrytyNaglowekSerwisow
            label: "Ukryty nagłówek listy serwisów (dla czytnika ekranu)"
            widget: string
            required: false
            hint: >-
              Nagłówek listy kafelków istniejący wyłącznie dla czytnika ekranu, gdy
              strona pokazuje jedną wspólną siatkę. Na ekranie niewidoczny. Puste pole =
              wraca napis domyślny: Serwisy.

          - name: linkPomijania
            label: "Odnośnik pomijania nawigacji (dla klawiatury)"
            widget: string
            required: false
            hint: >-
              Odnośnik widoczny dopiero po naciśnięciu klawisza Tab, przeskakuje do
              treści. Puste pole = wraca napis domyślny: Przejdź do treści.

      # ---- oferta (strona główna) ----
      # Lustro src/data/oferta.json, czyta go src/components/Oferta.astro i /llms.txt.
      - name: oferta
        label: "Oferta (strona główna)"
        file: "src/data/oferta.json"
        fields:
          - { name: zakresNaglowek, label: "Nagłówek: czym się zajmujemy", widget: string, required: false }
          - { name: zakresLead, label: "Zdanie pod nagłówkiem oferty", widget: text, required: false }
          - name: zakres
            label: "Czym się zajmujemy"
            widget: list
            fields:
              - { name: nazwa, label: "Nazwa", widget: string }
              - { name: opis, label: "Opis", widget: text, required: false }
          - { name: procesNaglowek, label: "Nagłówek: jak pracujemy", widget: string, required: false }
          - name: proces
            label: "Kroki pracy (kolejność = numer)"
            widget: list
            fields:
              - { name: nazwa, label: "Krok", widget: string }
              - { name: opis, label: "Opis", widget: text, required: false }
          - { name: dostajeszNaglowek, label: "Nagłówek: co dostajesz", widget: string, required: false }
          - { name: dostajesz, label: "Co dostajesz", widget: list, field: { name: pozycja, label: "Pozycja", widget: text } }
          - { name: technologiaNaglowek, label: "Nagłówek: technologia", widget: string, required: false }
          - name: technologia
            label: "Dlaczego Astro i taki hosting"
            widget: list
            fields:
              - { name: nazwa, label: "Nazwa", widget: string }
              - { name: opis, label: "Opis", widget: text, required: false }
          - { name: kontaktNaglowek, label: "Nagłówek kontaktu", widget: string, required: false }
          - { name: kontaktTekst, label: "Tekst kontaktu", widget: text, required: false }
          - { name: kontaktMail, label: "Napis odnośnika e-mail", widget: string, required: false }
          - { name: kontaktTelefon, label: "Napis odnośnika telefonu", widget: string, required: false }
          - { name: kontaktSiedziba, label: "Etykieta adresu siedziby", widget: string, required: false }

      # ---- cena (/cena) ----
      # Lustro src/data/cena.json, czyta go src/pages/cena.astro. Cennik orientacyjny EcoPower Polska, ceny netto.
      # Wszystkie kwoty są tekstem — dowolny wpis buduje się poprawnie (docs/CMS-ZASADY-PRACY.md ③).
      - name: cena
        label: "Cennik (/cena)"
        file: "src/data/cena.json"
        description: >-
          Podstrona /cena: cennik orientacyjny EcoPower Polska za stronę i sklep, ceny netto.
          Kolejność wierszy w panelu = kolejność w tabeli.
        fields:
          - { name: tytulKarty, label: "Tytuł karty i wyniku w wyszukiwarce", widget: string, required: false }
          - { name: opisWyszukiwarki, label: "Opis dla wyszukiwarek", widget: text, required: false }
          - { name: naglowek, label: "Nagłówek strony (H1)", widget: string, required: false }
          - { name: lead, label: "Zdanie pod nagłówkiem", widget: text, required: false }
          - { name: zastrzezenie, label: "Ramka: netto, VAT, aktualność cennika", widget: text, required: false }
          - { name: kolumnaPozycji, label: "Tabela: nagłówek kolumny półki", widget: string, required: false }
          - { name: kolumnaCeny, label: "Tabela: nagłówek kolumny ceny", widget: string, required: false }
          - { name: brakCeny, label: "Napis, gdy cena jest pusta", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: wycena indywidualna" }
          - { name: stronaWykonanieNaglowek, label: "Tabela 1: nagłówek (strona, wykonanie)", widget: string, required: false }
          - { name: stronaWykonanieOpis, label: "Tabela 1: zdanie pod nagłówkiem", widget: text, required: false }
          - name: stronaWykonanie
            label: "Tabela 1: wiersze"
            widget: list
            fields:
              - { name: pozycja, label: "Półka (nazwa pozycji)", widget: string }
              - { name: opis, label: "Opis pod nazwą półki", widget: text, required: false }
              - { name: cena, label: "Cena (np. 2 900 zł)", widget: string, required: false, hint: "Puste pole = na stronie napis z pola: Napis, gdy cena jest pusta" }
              - { name: jednostka, label: "Jednostka (np. miesięcznie, rocznie, za wpis)", widget: string, required: false, hint: "Puste pole = cena jednorazowa, bez dopisku" }
          - { name: stronaProwadzenieNaglowek, label: "Tabela 2: nagłówek (strona, prowadzenie)", widget: string, required: false }
          - { name: stronaProwadzenieOpis, label: "Tabela 2: zdanie pod nagłówkiem", widget: text, required: false }
          - name: stronaProwadzenie
            label: "Tabela 2: wiersze"
            widget: list
            fields:
              - { name: pozycja, label: "Półka (nazwa pozycji)", widget: string }
              - { name: opis, label: "Opis pod nazwą półki", widget: text, required: false }
              - { name: cena, label: "Cena (np. 2 900 zł)", widget: string, required: false, hint: "Puste pole = na stronie napis z pola: Napis, gdy cena jest pusta" }
              - { name: jednostka, label: "Jednostka (np. miesięcznie, rocznie, za wpis)", widget: string, required: false, hint: "Puste pole = cena jednorazowa, bez dopisku" }
          - { name: sklepWykonanieNaglowek, label: "Tabela 3: nagłówek (sklep, uruchomienie)", widget: string, required: false }
          - { name: sklepWykonanieOpis, label: "Tabela 3: zdanie pod nagłówkiem", widget: text, required: false }
          - name: sklepWykonanie
            label: "Tabela 3: wiersze"
            widget: list
            fields:
              - { name: pozycja, label: "Półka (nazwa pozycji)", widget: string }
              - { name: opis, label: "Opis pod nazwą półki", widget: text, required: false }
              - { name: cena, label: "Cena (np. 2 900 zł)", widget: string, required: false, hint: "Puste pole = na stronie napis z pola: Napis, gdy cena jest pusta" }
              - { name: jednostka, label: "Jednostka (np. miesięcznie, rocznie, za wpis)", widget: string, required: false, hint: "Puste pole = cena jednorazowa, bez dopisku" }
          - { name: sklepProwadzenieNaglowek, label: "Tabela 4: nagłówek (sklep, prowadzenie)", widget: string, required: false }
          - { name: sklepProwadzenieOpis, label: "Tabela 4: zdanie pod nagłówkiem", widget: text, required: false }
          - name: sklepProwadzenie
            label: "Tabela 4: wiersze"
            widget: list
            fields:
              - { name: pozycja, label: "Półka (nazwa pozycji)", widget: string }
              - { name: opis, label: "Opis pod nazwą półki", widget: text, required: false }
              - { name: cena, label: "Cena (np. 2 900 zł)", widget: string, required: false, hint: "Puste pole = na stronie napis z pola: Napis, gdy cena jest pusta" }
              - { name: jednostka, label: "Jednostka (np. miesięcznie, rocznie, za wpis)", widget: string, required: false, hint: "Puste pole = cena jednorazowa, bez dopisku" }
          - { name: ctaNaglowek, label: "Ramka kontaktu: nagłówek", widget: string, required: false }
          - { name: ctaTekst, label: "Ramka kontaktu: zdanie", widget: text, required: false }
          - { name: ctaLink, label: "Ramka kontaktu: napis odnośnika do kontaktu", widget: string, required: false }
          - { name: stronaGlowna, label: "Ścieżka: odnośnik strony głównej", widget: string, required: false }
          - { name: okruszkiEtykieta, label: "Nazwa ścieżki (dla czytnika ekranu)", widget: string, required: false }

      # ---- stopka ----
      - name: stopka
        label: "Stopka"
        file: "src/data/stopka.json"
        description: >-
          Etykiety i napisy stopki. Same DANE spółki (KRS, NIP, telefon) zmienia się
          w pozycji menu Dane firmy — tutaj są tylko podpisy przed nimi. Wyczyszczenie
          pola przywraca napis domyślny.
        fields:
          # Skróty rejestrowe stoją w jednym wierszu nad resztą — stąd na początku.
          - name: etykietaKrs
            label: "Podpis przed numerem KRS"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: KRS"

          - name: etykietaNip
            label: "Podpis przed numerem NIP"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: NIP"

          - name: etykietaRegon
            label: "Podpis przed numerem REGON"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: REGON"

          - name: etykietaFormaPrawna
            label: "Podpis przed formą prawną"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Forma prawna:"

          - name: etykietaAdresWww
            label: "Podpis przed adresem WWW"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Adres WWW:"

          - name: etykietaEmail
            label: "Podpis przed adresem e-mail"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: E-mail:"

          - name: etykietaAdres
            label: "Podpis przed adresem siedziby"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Adres:"

          - name: etykietaTelefon
            label: "Podpis przed numerem telefonu"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Telefon:"

          - name: guzikKopiujWszystko
            label: "Napis na guziku kopiowania danych"
            widget: string
            required: false
            hint: >-
              Guzik, który kopiuje komplet danych spółki do schowka. Puste pole = wraca
              napis domyślny: Skopiuj dane spółki.

          - name: potwierdzenieKopiowania
            label: "Napis po udanym skopiowaniu"
            widget: string
            required: false
            hint: >-
              Pojawia się na guziku na chwilę po kliknięciu. Puste pole = wraca napis
              domyślny: Skopiowano.

          - name: bladKopiowania
            label: "Napis, gdy kopiowanie się nie uda"
            widget: string
            required: false
            hint: >-
              Widoczny rzadko — przeglądarka potrafi odmówić dostępu do schowka. Puste
              pole = wraca napis domyślny: Nie udało się skopiować.

      # ---- blog i menu ----
      - name: blog
        label: "Blog i menu"
        file: "src/data/blog.json"
        description: >-
          Napisy listy wpisów /blog/, pozycji menu w górnym pasku i w stopce oraz stron
          wpisów. Wyczyszczenie pola przywraca napis domyślny.
        fields:
          - { name: menuOferta, label: "Menu i stopka: pozycja oferty", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Oferta" }
          - { name: menuRealizacje, label: "Menu i stopka: pozycja realizacji", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Realizacje" }
          - { name: menuCena, label: "Menu i stopka: pozycja cen", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Cena" }
          - { name: menuFaq, label: "Menu: pozycja pytań i odpowiedzi", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: FAQ" }
          - { name: menuBlog, label: "Menu i stopka: pozycja bloga", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Blog" }
          - { name: menuKontakt, label: "Menu i stopka: pozycja kontaktu", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Kontakt" }
          - { name: stronaGlowna, label: "Stopka i ścieżka: odnośnik strony głównej", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Strona główna" }
          - { name: tytulKarty, label: "Lista wpisów: tytuł karty i wyniku w wyszukiwarce", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Blog — EcoPower Polska" }
          - { name: opisWyszukiwarki, label: "Lista wpisów: opis dla wyszukiwarek", widget: text, required: false, hint: "Puste pole = wraca napis domyślny." }
          - { name: naglowek, label: "Lista wpisów: nagłówek", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Blog" }
          - { name: lead, label: "Lista wpisów: zdanie pod nagłówkiem", widget: string, required: false, hint: "Puste pole = wraca napis domyślny." }
          - { name: pusto, label: "Lista wpisów: komunikat, gdy nie ma wpisów", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Nie ma jeszcze wpisów." }
          - { name: opublikowano, label: "Wpis: napis przed datą", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Opublikowano" }
          - { name: wszystkie, label: "Strona główna i wpis: odnośnik do listy wpisów", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Wszystkie wpisy" }
          - { name: naglowekGlowna, label: "Strona główna: nagłówek sekcji z ostatnimi wpisami", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Z bloga" }
          - { name: udostepnij, label: "Wpis: guzik udostępnienia na Facebooku", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Udostępnij na Facebooku" }
          - { name: udostepnijNowaKarta, label: "Wpis: dopisek dla czytnika ekranu przy guziku udostępnienia", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: (otwiera się w nowej karcie)" }
          - { name: etykietaMenu, label: "Nazwa menu górnego (dla czytnika ekranu)", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Menu główne" }
          - { name: etykietaMenuStopki, label: "Nazwa menu w stopce (dla czytnika ekranu)", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Strony witryny" }
          - { name: okruszkiEtykieta, label: "Nazwa ścieżki nad wpisem (dla czytnika ekranu)", widget: string, required: false, hint: "Puste pole = wraca napis domyślny: Ścieżka" }

      # ---- strona błędu 404 ----
      - name: strona404
        label: "Strona błędu 404"
        file: "src/data/strona-404.json"
        description: >-
          Strona pokazywana, gdy ktoś wejdzie pod adres, którego u nas nie ma (literówka
          w adresie, stary odnośnik). Wyczyszczenie pola przywraca napis domyślny.
        fields:
          - name: tytulKarty
            label: "Tytuł karty przeglądarki"
            widget: string
            required: false
            hint: >-
              Puste pole = wraca napis domyślny: Nie ma takiej strony — EcoPower Polska.

          - name: opisWyszukiwarki
            label: "Opis dla wyszukiwarek"
            widget: text
            required: false
            hint: >-
              Puste pole = wraca napis domyślny: Pod tym adresem nic nie ma. Wróć na
              stronę główną EcoPower Polska: strony i sklepy internetowe dla firm.

          - name: naglowek
            label: "Nagłówek na stronie błędu"
            widget: string
            required: false
            hint: >-
