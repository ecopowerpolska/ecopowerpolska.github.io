      # ---- efekty (/efekty) ----
      # Lustro src/data/efekty.json, czytają go src/pages/efekty/index.astro i src/pages/efekty/animacja-przewijaniem.astro.
      # Karta pokazuje się tylko przy statusie „gotowy”. Slug = adres podstrony /efekty/<slug>/ (podstronę robi programista).
      - name: efekty
        label: "Efekty (/efekty)"
        file: "src/data/efekty.json"
        description: >-
          Podstrona /efekty: „Wybierz efekt”, dodatkowa część portfolio. Kolejność w panelu = kolejność kart.
        fields:
          - { name: tytulKarty, label: "Tytuł karty i wyniku w wyszukiwarce", widget: string, required: false }
          - { name: opisWyszukiwarki, label: "Opis dla wyszukiwarek", widget: text, required: false }
          - { name: naglowek, label: "Nagłówek strony (H1)", widget: string, required: false }
          - { name: lead, label: "Zdanie pod nagłówkiem", widget: text, required: false }
          - { name: wydajnoscZdanie, label: "Zdanie o szybkości i pomiarze PageSpeed", widget: text, required: false }
          - { name: wybierzNaglowek, label: "Nagłówek nad kartami", widget: string, required: false }
          - { name: przycisk, label: "Napis przycisku na karcie", widget: string, required: false }
          - name: efekty
            label: "Efekty (karty)"
            widget: list
            fields:
              - { name: nazwa, label: "Nazwa efektu (też H1 podstrony)", widget: string }
              - { name: slug, label: "Adres podstrony (/efekty/…/)", widget: string, hint: "Małe litery, cyfry i myślniki. Zmiana adresu wymaga programisty." }
              - { name: opisKrotki, label: "Opis na karcie", widget: text, required: false }
              - { name: opisDlugi, label: "Podstrona: akapit „Co to daje”", widget: text, required: false }
              - { name: dlaKogo, label: "Podstrona: dla kogo", widget: text, required: false }
              - { name: kosztWzgledny, label: "Karta: koszt wydajności w jednym zdaniu", widget: text, required: false }
              - { name: kosztWydajnosci, label: "Podstrona: akapit „Ile kosztuje wydajności”", widget: text, required: false }
              - { name: status, label: "Status", widget: select, options: ["gotowy", "w przygotowaniu"], default: "gotowy" }
              - { name: miniatura, label: "Miniatura karty (ścieżka w public/)", widget: string, required: false }
              - { name: alt, label: "Opis miniatury dla niewidomych", widget: text, required: false }


      # ---- stopka ----
      - name: stopka
        label: "Stopka"
        file: "src/data/stopka.json"
        description: >-
          Etykiety i napisy stopki. Same DANE spółki (KRS, NIP, telefon) zmienia się
          w pozycji menu Dane firmy — tutaj są tylko podpisy przed nimi. Wyczyszczenie
          pola przywraca napis domyślny.
        fields:
          # Skróty rejestrowe stoją w jednym wierszu nad resztą — stąd na początku.
          - name: etykietaKrs
            label: "Podpis przed numerem KRS"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: KRS"

          - name: etykietaNip
            label: "Podpis przed numerem NIP"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: NIP"

          - name: etykietaRegon
            label: "Podpis przed numerem REGON"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: REGON"

          - name: etykietaFormaPrawna
            label: "Podpis przed formą prawną"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Forma prawna:"

          - name: etykietaAdresWww
            label: "Podpis przed adresem WWW"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Adres WWW:"

          - name: etykietaEmail
            label: "Podpis przed adresem e-mail"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: E-mail:"

          - name: etykietaAdres
            label: "Podpis przed adresem siedziby"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Adres:"

          - name: etykietaTelefon
            label: "Podpis przed numerem telefonu"
            widget: string
            required: false
            hint: "Puste pole = wraca napis domyślny: Telefon:"

          - name: guzikKopiujWszystko
            label: "Napis na guziku kopiowania danych"
            widget: string
            required: false
            hint: >-
              Guzik, który kopiuje komplet danych spółki do schowka. Puste pole = wraca
              napis domyślny: Skopiuj dane spółki.

          - name: potwierdzenieKopiowania
            label: "Napis po udanym skopiowaniu"
            widget: string
            required: false
            hint: >-
              Pojawia się na guziku na chwilę po kliknięciu. Puste pole = wraca napis
              domyślny: Skopiowano.

          - name: bladKopiowania
            label: "Napis, gdy kopiowanie się nie uda"
            widget: string
            required: false
            hint: >-
              Widoczny rzadko — przeglądarka potrafi odmówić dostępu do schowka. Puste
              pole = wraca napis domyślny: Nie udało się skopiować.

