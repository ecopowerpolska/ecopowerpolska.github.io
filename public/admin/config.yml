  # ── ④ DANE FIRMY ────────────────────────────────────────────────────────────
  - name: firma
    label: "Dane firmy"
    files:
      - name: dane
        label: "Dane rejestrowe (stopka)"
        file: "src/data/firma.json"
        description: >-
          Dane przepisane ze starej strony. Zmieniaj wyłącznie wtedy, gdy zmienił się
          wpis w rejestrze. Puste pole nie renderuje się w stopce. Podpisy stojące przed
          tymi danymi (Forma prawna:, NIP: i tak dalej) zmienia się w pozycji menu Teksty
          strony, w formularzu Stopka.
        fields:
          - { name: nazwaPelna, label: "Nazwa pełna (rejestrowa)", widget: string }
          - name: nazwaKrotka
            label: "Nazwa skrócona (widoczna na stronie)"
            widget: string
            hint: "BEZ formy prawnej."
          - name: nazwaStopka
            label: "Nazwa w stopce"
            widget: string
            required: false
            hint: "Skrót z formą prawną, np. EcoPower Polska Sp. z o.o. Puste pole = nazwa pełna."
          - { name: rejestr, label: "Rejestr", widget: string }
          - { name: krs, label: "KRS", widget: string }
          - { name: nip, label: "NIP", widget: string }
          - { name: regon, label: "REGON", widget: string }
          - { name: formaPrawna, label: "Forma prawna", widget: string }
          - { name: adresWww, label: "Adres WWW", widget: string }
          - { name: email, label: "E-mail", widget: string }
          - name: adresSiedziby
            label: "Adres siedziby"
            widget: string
            required: false
            hint: "Puste = nie pokazuje się w stopce. Do uzupełnienia przez Piotra."
          - name: telefon
            label: "Telefon"
            widget: string
            required: false
            hint: "Puste = nie pokazuje się w stopce. Do uzupełnienia przez Piotra."
          # Adres pocztowy z odpisu KRS — idzie do danych strukturalnych (LocalBusiness) i /llms.txt.
          - { name: kodPocztowy, label: "Kod pocztowy", widget: string, required: false }
          - { name: miejscowosc, label: "Miejscowość", widget: string, required: false }
          - { name: wojewodztwo, label: "Województwo", widget: string, required: false }
          - { name: kraj, label: "Kraj (kod, np. PL)", widget: string, required: false }
