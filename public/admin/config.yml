# config.yml — panel treści Sveltia CMS dla ecopowerpolska.pl
#
# 🔴 TEN PLIK JEST LUSTREM src/content.config.ts. Nazwy pól identyczne, typy zgodne.
#    Rozjazd nie wychodzi w panelu — wychodzi czerwonym buildem w Actions, już PO
#    zapisaniu wpisu przez klienta (potwor-cms-strony §D2).
#
# ⚠️ PANEL SIĘ ŁADUJE, ZAPIS JESZCZE NIE PRZETESTOWANY (stan 2026-09-06). Sprawdzone
#    na żywo: https://ecopowerpolska.github.io/admin/ renderuje ekran logowania bez
#    błędów blokujących. Ale ŻADEN wpis nie został jeszcze zapisany przez panel —
#    pierwsze logowanie i pierwszy zapis Piotra są POMIAREM tej konfiguracji,
#    nie formalnością. Składnia widgetów: dokumentacja Decapa (Sveltia ją honoruje);
#    ustalenia o samym logowaniu — z kodu źródłowego Sveltii, patrz komentarz w `backend`.
#
# 🔴 `repo` niżej zakłada repozytorium `ecopowerpolska/ecopowerpolska.github.io`
#    (witryna użytkownika, bez `base`). Jeśli Piotr wybierze inną nazwę repozytorium,
#    trzeba poprawić TĘ linię i `site`/`base` w astro.config.mjs.

backend:
  name: github
  repo: ecopowerpolska/ecopowerpolska.github.io
  branch: main
  # LOGOWANIE — pełna instrukcja krok po kroku dla Piotra: docs/CMS-LOGOWANIE.md.
  # Skrót ustaleń (sprawdzone w KODZIE Sveltii, gałąź main, 2026-09-06):
  #
  # 🔴 `auth_methods: [token]` — zostaje TYLKO przycisk „Zaloguj się za pomocą tokenu
  # dostępu". Bez tej linii panel pokazuje TAKŻE „Zaloguj się przez GitHub" (OAuth),
  # a ten przycisk i tak nie działa: wymaga Workera `sveltia-cms-auth`, który nie jest
  # wdrożony (zob. `base_url` niżej). Klikalny, ale zepsuty przycisk jest gorszy niż
  # jego brak. Źródło: src/lib/components/entrance/sign-in.svelte (Sveltia chowa
  # przycisk OAuth, gdy `auth_methods` go nie wymienia) i
  # src/lib/services/config/parser/backend.js (nazwa i składnia klucza).
  auth_methods: [token]
  #
  # base_url: https://sveltia-cms-auth.<TWOJA-SUBDOMENA>.workers.dev
  # ↑ ZAKOMENTOWANE CELOWO. Odkomentuj DOPIERO gdy Worker `sveltia-cms-auth` będzie
  # wdrożony na Cloudflare (docs/CMS-LOGOWANIE.md, „POZYCJE DLA PIOTRA") — podmień
  # <TWOJA-SUBDOMENA> na rzeczywisty adres z panelu Cloudflare Workers. Gdy ta linia
  # wraca, zmień też linię wyżej na `auth_methods: [token, oauth]` (albo usuń ją
  # całkiem), żeby przycisk OAuth znów się pokazał.
  #
  # Token GitHuba do logowania „za pomocą tokenu": FINE-GRAINED (nowy typ), nie
  # klasyczny. Sveltia sama generuje link do
  # github.com/settings/personal-access-tokens/new z uprawnieniem „Contents: write"
  # wstawionym z góry (src/lib/services/backends/git/github/auth.js, funkcja
  # getTokenPageURL — sprawdzone 2026-09-06). Repozytorium/właściciela trzeba wybrać
  # na tamtej stronie ręcznie — Sveltia tego nie robi za Piotra.
  # Token trafia do magazynu przeglądarki (localStorage) — wklejany RAZ na
  # przeglądarkę/urządzenie, nie przy każdym logowaniu.
  # 🔴 Token jest SEKRETEM: nie trafia do repo, do tego pliku ani do rozmowy
  # (kontrakt warsztatu §4.4).

# Ścieżki mediów: obrazki kafelków MUSZĄ trafiać do src/assets/, nie do public/ —
# tylko wtedy <Image> Astro je optymalizuje (obraz w public/ traci optymalizację).
media_folder: "src/assets/serwisy"
public_folder: "src/assets/serwisy"

publish_mode: simple

collections:
  # ── KAFELKI ─────────────────────────────────────────────────────────────────
  # Dołożenie serwisu = jeden wpis tutaj. Żadnej zmiany kodu.
  - name: serwisy
    label: "Serwisy (kafelki)"
    label_singular: "Serwis"
    description: >-
      Jeden wpis = jeden kafelek na stronie głównej. Kliknięcie kafelka przenosi
      pod adres docelowy. Kolejność ustala pole „Kolejność" (rosnąco).
    folder: "src/data/serwisy"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: nazwa
    slug: "{{slug}}"
    summary: "{{nazwa}} — {{adres}}"
    sortable_fields: [kolejnosc, nazwa, kategoria]
    # Ścieżki WZGLĘDNE wobec pliku wpisu — dzięki temu we frontmatterze ląduje
    # `../../assets/serwisy/plik.png`, a tego właśnie oczekuje helper image()
    # ze schematu kolekcji Astro.
    media_folder: "../../assets/serwisy"
    public_folder: "../../assets/serwisy"
    fields:
      - name: nazwa
        label: "Nazwa serwisu"
        widget: string
        required: true
        hint: "Napis na kafelku, np. nadihome.pl"

      - name: adres
        label: "Adres docelowy"
        widget: string
        required: true
        hint: "Pełny adres z https:// — tam prowadzi kliknięcie kafelka."
        # Wzorzec musi być RÓWNIE OSTRY co schemat Zod (z.string().url()), inaczej panel
        # przepuści adres, który zatrzyma build w Actions — już PO zapisie klienta.
        # `[^\s]` odcina spacje w środku, na których luźne `.+` by przeszło.
        pattern:
          - "^https?://[^\\s]+\\.[^\\s]+$"
          - "Adres musi zaczynać się od http:// albo https:// i nie może zawierać spacji"

      - name: opis
        label: "Krótki podpis (opcjonalnie)"
        widget: string
        required: false
        # Limit 160 znaków egzekwuje schemat Zod przy buildzie. Bez tego wzorca panel
        # przyjąłby dłuższy podpis, a strona przestałaby się budować po zapisie klienta.
        pattern:
          - "^.{0,160}$"
          - "Podpis może mieć najwyżej 160 znaków"
        hint: "Do 160 znaków. Puste pole jest w porządku — kafelek pokaże samą nazwę."

      - name: kategoria
        label: "Kategoria / branża (opcjonalnie)"
        widget: string
        required: false
        # Limit 60 znaków egzekwuje schemat Zod przy buildzie — bez tego wzorca panel
        # przyjąłby dłuższą kategorię, a strona przestałaby się budować po zapisie.
        pattern:
          - "^.{0,60}$"
          - "Kategoria może mieć najwyżej 60 znaków"
        hint: >-
          Np. „Wnętrza i remonty". Strona zaczyna grupować kafelki w sekcje dopiero
          wtedy, gdy są DWIE różne kategorie — przy jednej albo przy żadnej pokazuje
          zwykłą siatkę. Wpisy bez kategorii trafiają wtedy do sekcji „Inne".
          ⚠️ Dopasowanie idzie po TREŚCI, nie po identyfikatorze: literówka tworzy
          nową kategorię. Przepisuj nazwę dokładnie tak, jak w poprzednim wpisie.
        # 🔴 WOLNY TEKST, nie zamknięta lista (`widget: select`), bo taksonomia serwisów
        # jeszcze nie istnieje — dziś żaden wpis nie ma kategorii. Gdy lista branż się
        # ustabilizuje, to pole warto zamienić na `select` z `options`: znika wtedy
        # ryzyko literówki. Decyzja należy do Piotra.

      - name: obrazek
        label: "Obrazek kafelka"
        widget: image
        required: false
        hint: >-
          Proporcje 16:9, zalecana szerokość co najmniej 720 px. Bez obrazka kafelek
          pokazuje czytelny placeholder z inicjałami.

      - name: alt
        label: "Opis obrazka dla czytnika ekranu"
        widget: string
        required: false
        hint: >-
          ⚠️ WYMAGANY, GDY DODAJESZ OBRAZEK — bez niego strona nie zbuduje się po zapisie.
          Opisz, co widać, np. „Wnętrze salonu Nadi Home".
        # 🔴 ZNANE OGRANICZENIE PANELU, świadomie zostawione. Schemat kolekcji wymaga `alt`
        # WARUNKOWO — tylko gdy wpis ma obrazek (reguła `.refine()` w content.config.ts).
        # Decap ani Sveltia nie umieją wyrazić „wymagane zależnie od innego pola": `required`
        # jest u nich stałe. Wybór stoi między:
        #   (a) required: false — redaktor może dodać obrazek bez altu i zatrzymać build (TO WYBRANE),
        #   (b) required: true  — alt trzeba wpisać ZAWSZE, także dla kafelka bez obrazka.
        # Wybrano (a), bo (b) zmusza do wypełniania pola, które przy braku obrazka do niczego
        # nie służy, a puste alty „na odczep" są gorsze niż zatrzymany build: build da się
        # naprawić, a bezużyteczny alt zostaje na stronie i psuje ją dla czytnika ekranu.
        # Siatką bezpieczeństwa jest build w Actions, nie panel. Do przemyślenia po pierwszym
        # realnym zapisie klienta (docs/PIERWSZY-PRZEBIEG.md, sekcja 9).

      - name: kolejnosc
        label: "Kolejność"
        widget: number
        value_type: int
        default: 100
        required: true
        hint: "Rosnąco: mniejsza liczba = wcześniejszy kafelek."

      - name: ukryty
        label: "Ukryty (zostaje w panelu, znika ze strony)"
        widget: boolean
        default: false
        required: false

  # ── DANE REJESTROWE W STOPCE ────────────────────────────────────────────────
  - name: ustawienia
    label: "Ustawienia"
    files:
      - name: firma
        label: "Dane rejestrowe (stopka)"
        file: "src/data/firma.json"
        description: >-
          Dane przepisane ze starej strony. Zmieniaj wyłącznie wtedy, gdy zmienił się
          wpis w rejestrze. Puste pole nie renderuje się w stopce.
        fields:
          - { name: nazwaPelna, label: "Nazwa pełna (rejestrowa)", widget: string }
          - { name: nazwaKrotka, label: "Nazwa skrócona", widget: string }
          - { name: rejestr, label: "Rejestr", widget: string }
          - { name: krs, label: "KRS", widget: string }
          - { name: nip, label: "NIP", widget: string }
          - { name: regon, label: "REGON", widget: string }
          - { name: formaPrawna, label: "Forma prawna", widget: string }
          - { name: adresWww, label: "Adres WWW", widget: string }
          - { name: email, label: "E-mail", widget: string }
          - name: adresSiedziby
            label: "Adres siedziby"
            widget: string
            required: false
            hint: "Puste = nie pokazuje się w stopce. Do uzupełnienia przez Piotra."
          - name: telefon
            label: "Telefon"
            widget: string
            required: false
            hint: "Puste = nie pokazuje się w stopce. Do uzupełnienia przez Piotra."
