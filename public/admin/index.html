      i dopisz tu nową datę i powód (potwor-cms-strony §D1).

      Panel jest wyłączony z indeksowania dwiema drogami: `noindex` wyżej
      i `Disallow: /admin/` w public/robots.txt.

      Logowanie i dodawanie kafelków — instrukcja dla Piotra: docs/CMS-LOGOWANIE.md.
