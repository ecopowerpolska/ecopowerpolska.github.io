<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EcoPower Polska">
  <!-- Znak firmowy, wariant A „E rejestrowe" (wybór Piotra 2026-09-07, docs/DECYZJE-WIZUALNE.md D5).
