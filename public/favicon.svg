       w motyw.css trzeba je tu przepisać ręcznie. -->
  <rect width="64" height="64" rx="10" fill="#15201a"/>
  <rect x="15" y="14" width="7" height="36" rx="2" fill="#5fbf9d"/>
  <rect x="22" y="14" width="26" height="7" rx="2" fill="#f4f5f1"/>
  <rect x="22" y="28.5" width="19" height="7" rx="2" fill="#f4f5f1"/>
